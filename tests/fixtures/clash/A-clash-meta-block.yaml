# Fixture A: block-style Clash Meta config.
# Covers every supported proxy type plus sections that must be ignored.
# Expected: 15 nodes imported, 3 skipped (ss+obfs, tuic v4, ssr).
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
dns:
  enable: true
  nameserver: [223.5.5.5]
proxies:
  - name: "HK-SS-01"
    type: ss
    server: hk1.example.com
    port: 8388
    cipher: aes-256-gcm
    password: "pass-ss"
    udp: true
  - name: "HK-SS-ShadowTLS"
    type: ss
    server: hk2.example.com
    port: 443
    cipher: 2022-blake3-aes-128-gcm
    password: "pass-ss2022"
    plugin: shadow-tls
    plugin-opts:
      host: cloud.tencent.com
      password: "stls-pass"
      version: 3
  - name: "HK-SS-obfs-应跳过"
    type: ss
    server: hk3.example.com
    port: 443
    cipher: aes-256-gcm
    password: "x"
    plugin: obfs
    plugin-opts: {mode: tls, host: bing.com}
  - name: "JP-VMess-WS"
    type: vmess
    server: jp1.example.com
    port: "443"
    uuid: 11111111-2222-3333-4444-555555555555
    alterId: 0
    cipher: auto
    tls: true
    servername: cdn.example.com
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /ws
      headers:
        Host: cdn.example.com
  - name: "US-VLESS-Reality"
    type: vless
    server: us1.example.com
    port: 443
    uuid: 66666666-7777-8888-9999-000000000000
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "pbk_base64_placeholder"
      short-id: "0123abcd"
  - name: "SG-VLESS-gRPC"
    type: vless
    server: sg1.example.com
    port: 2053
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    network: grpc
    tls: true
    servername: sg1.example.com
    grpc-opts:
      grpc-service-name: "grpcsvc"
  - name: "TW-Trojan"
    type: trojan
    server: tw1.example.com
    port: 443
    password: "trojan-pass"
    sni: tw1.example.com
    skip-cert-verify: true
    alpn: [h2, http/1.1]
  - name: "KR-Hy2"
    type: hysteria2
    server: kr1.example.com
    port: 8443
    password: "hy2-pass"
    sni: kr1.example.com
    obfs: salamander
    obfs-password: "obfs-pass"
    skip-cert-verify: false
  - name: "KR-Hy2-ports-降级"
    type: hysteria2
    server: kr2.example.com
    ports: 20000-30000
    password: "hy2-pass2"
    sni: kr2.example.com
  - name: "DE-TUIC"
    type: tuic
    server: de1.example.com
    port: 443
    uuid: 12345678-1234-1234-1234-123456789abc
    password: "tuic-pass"
    alpn: [h3]
    sni: de1.example.com
  - name: "DE-TUIC-v4-应跳过"
    type: tuic
    server: de2.example.com
    port: 443
    token: "legacy-token"
  - name: "WG-Home"
    type: wireguard
    server: wg.example.com
    port: 51820
    ip: 10.0.0.2
    ipv6: fd00::2
    private-key: "cHJpdmF0ZS1rZXktcGxhY2Vob2xkZXI="
    public-key: "cHVibGljLWtleS1wbGFjZWhvbGRlcg=="
    pre-shared-key: "cHNrLXBsYWNlaG9sZGVy"
    mtu: 1280
  - name: "FR-AnyTLS"
    type: anytls
    server: fr1.example.com
    port: 443
    password: "anytls-pass"
    client-fingerprint: chrome
    sni: fr1.example.com
  - name: "HK-Snell"
    type: snell
    server: hk4.example.com
    port: 44046
    psk: "snell-psk"
    version: 4
    obfs-opts:
      mode: tls
      host: bing.com
  - name: "Local-SOCKS5"
    type: socks5
    server: 127.0.0.1
    port: 1080
    username: u
    password: p
  - name: "Local-HTTP-TLS"
    type: http
    server: proxy.example.com
    port: 8443
    username: u
    password: p
    tls: true
    sni: proxy.example.com
  - name: "SSR-应跳过"
    type: ssr
    server: ssr.example.com
    port: 443
    cipher: aes-256-cfb
    password: x
    protocol: origin
    obfs: plain
proxy-groups:
  - name: PROXY
    type: select
    proxies: [HK-SS-01, JP-VMess-WS, US-VLESS-Reality]
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://example.com/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
rules:
  - DOMAIN-SUFFIX,google.com,PROXY
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
