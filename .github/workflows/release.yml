name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version from tag
        id: ver
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $tag = $env:REF_NAME
          if ($env:REF_TYPE -eq 'tag') {
            $ver = ($tag -replace '^v','') -replace '-.*$',''
          } else {
            $xml = [xml](Get-Content AnywhereWinUI.csproj)
            $ver = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -ExpandProperty Version)
            if (-not $ver) { $ver = '1.0.0' }
          }
          if ($ver -notmatch '^\d+(\.\d+){0,3}$') { $ver = '1.0.0' }
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $ver (from ref $tag)"

      - name: Prepare native sing-box for ARM64
        if: matrix.rid == 'win-arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "Swell-CI" } "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match 'windows-arm64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find windows-arm64 asset in SagerNet/sing-box latest release" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "sb-arm64.zip"
          Expand-Archive -Path "sb-arm64.zip" -DestinationPath "sb-arm64" -Force
          $armExe = Get-ChildItem -Path "sb-arm64" -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          Copy-Item $armExe.FullName -Destination "Assets/sing-box.exe" -Force
          if (Test-Path "Assets/libcronet.dll") { Remove-Item "Assets/libcronet.dll" -Force }
          Remove-Item "sb-arm64.zip" -Force
          Remove-Item "sb-arm64" -Recurse -Force
          Write-Host "Replaced Assets/sing-box.exe with native windows-arm64 $($rel.tag_name)"

      - name: Run Parser Unit Tests
        run: dotnet test tests/AnywhereWinUI.Parsers.Tests/AnywhereWinUI.Parsers.Tests.csproj -c Release -nologo

      - name: Publish App (${{ matrix.rid }})
        run: >
          dotnet publish AnywhereWinUI.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:WindowsAppSDKSelfContained=true
          -p:CopyOutputSymbolsToPublishDirectory=false
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish Updater (${{ matrix.rid }})
        run: >
          dotnet publish AnywhereWinUI.Updater/AnywhereWinUI.Updater.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Verify exe produced
        shell: pwsh
        run: |
          $publishDir = (Get-ChildItem -Path "bin" -Filter "publish" -Recurse -Directory | Where-Object { $_.FullName -match "${{ matrix.rid }}" } | Select-Object -First 1).FullName
          if (-not $publishDir) {
            Write-Host "::error::Could not find publish directory"
            exit 1
          }
          $exe = "$publishDir/Swell Proxy.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Publish did not produce $exe"
            exit 1
          }
          $priExternal = (Test-Path "$publishDir/Swell Proxy.pri") -or (Test-Path "$publishDir/resources.pri")
          $priBundled  = $false
          if (-not $priExternal) {
            $needle = [System.Text.Encoding]::ASCII.GetBytes("Swell Proxy.pri")
            $bytes  = [System.IO.File]::ReadAllBytes($exe)
            $priBundled = [System.MemoryExtensions]::IndexOf([System.ReadOnlySpan[byte]]$bytes, [System.ReadOnlySpan[byte]]$needle) -ge 0
          }
          if (-not ($priExternal -or $priBundled)) {
            Write-Host "::error::Publish did not include MRT resource index (Swell Proxy.pri) in $publishDir"
            exit 1
          }
          Write-Host "OK: exe found at $exe ($((Get-Item $exe).Length) bytes, priExternal=$priExternal, priBundled=$priBundled)"

      - name: Pack zip
        shell: pwsh
        run: |
          $publishDir = (Get-ChildItem -Path "bin" -Filter "publish" -Recurse -Directory | Where-Object { $_.FullName -match "${{ matrix.rid }}" -and $_.FullName -notmatch "Updater" } | Select-Object -First 1).FullName
          $updaterPublishDir = (Get-ChildItem -Path "AnywhereWinUI.Updater/bin" -Filter "publish" -Recurse -Directory | Where-Object { $_.FullName -match "${{ matrix.rid }}" } | Select-Object -First 1).FullName
          $updaterExe = "$updaterPublishDir/Swell.Updater.exe"
          Copy-Item $updaterExe -Destination $publishDir
          
          $zipName = "Swell-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created $zipName ($((Get-Item $zipName).Length) bytes)"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $zip = "Swell-${{ matrix.rid }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $zip", [System.Text.Encoding]::ASCII)
          Write-Host "Wrote $zip.sha256 = $hash"

      - name: Determine release flags
        id: relflags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $commitMsg = (git log -1 --pretty=%B) -join "`n"
          $isPre = $false
          if ($tag -match '-') { $isPre = $true }
          if ($commitMsg -match '\[prerelease\]') { $isPre = $true }
          try {
            $raw = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0 -and $raw) {
              $existing = $raw | ConvertFrom-Json
              if ($existing.prerelease -eq $true) { $isPre = $true }
            }
          } catch {
            # Release does not exist yet
          }
          $global:LASTEXITCODE = 0
          $preStr = if ($isPre) { 'true' } else { 'false' }
          $latestStr = if ($isPre) { 'false' } else { 'true' }
          "prerelease=$preStr" | Out-File $env:GITHUB_OUTPUT -Append
          "make_latest=$latestStr" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Release flags for ${tag}: prerelease=$preStr, make_latest=$latestStr"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            Swell-${{ matrix.rid }}.zip
            Swell-${{ matrix.rid }}.zip.sha256
          generate_release_notes: true
          prerelease: ${{ steps.relflags.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.relflags.outputs.make_latest }}
